services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storylingo-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - ./ai_engine:/app/ai_engine
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: storylingo-frontend
    ports:
      - "3000:80"  
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped